name: Проверка MediaHUB
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py cache_refresh.py system_setup.py download_organizer.py
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh CHECK_INSTALL.sh BACKUP_MEDIAHUB.sh scripts/*.sh
      - name: ShellCheck установщика и обновления
        run: shellcheck -S error scripts/*.sh
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Get-ChildItem *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
